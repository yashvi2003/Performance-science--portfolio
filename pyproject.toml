[project]
name = "neuromuscular-toolkit"
version = "0.1.0"
description = "Neuromuscular monitoring toolkit: automated jump analysis, readiness baselines, and real-world evidence analytics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yashvi" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.2",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.35.0",
    "duckdb>=1.0.0",
    "statsmodels>=0.14.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "p1_nmt_pipeline", "p2_nmt_reports", "p3_nmt_profiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
